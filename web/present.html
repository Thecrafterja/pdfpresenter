<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#111113">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<title>Typst Present</title>
</head>
<body>

<div id="audience"><div class="stage" id="aStage"><canvas id="aCanvas"></canvas></div><button id="btnAudienceFull" title="Fullscreen (F)">⛶</button></div>

<div id="presenter">
  <div class="stage" id="cur"><canvas id="cCanvas"></canvas></div>
  <div class="stage" id="nxt"><canvas id="nCanvas"></canvas></div>
  <div id="notes"></div>
  <div id="bar">
    <span class="big" id="counter">– / –</span>
    <span class="big" id="timer">00:00</span>
    <button id="btnTimerPause" title="Pause/resume timer">⏸</button>
    <button id="btnTimerReset" title="Reset timer">↺</button>
    <span class="big" id="slideTimer">00:00</span>
    <span id="clock"></span>
    <span class="sp"></span>
    <button id="btnBlank" title="B">Blank</button>
    <button id="btnFull" title="F">Fullscreen</button>

    <div class="menu" id="menuDisplay">
      <button id="btnDisplayMenu" class="menuTrigger">Display ▾</button>
      <div class="menuList">
        <div class="menuRow">
          <span>Notes size</span>
          <button id="btnNotesMinus" title="Smaller notes">A−</button>
          <button id="btnNotesPlus" title="Larger notes">A+</button>
        </div>
        <button id="btnZoomReset" title="Reset zoom (0)">Zoom 100%</button>
        <button id="btnLayout" title="L">Layout: Standard</button>
      </div>
    </div>

    <div class="menu" id="menuFile">
      <button id="btnFileMenu" class="menuTrigger">File ▾</button>
      <div class="menuList">
        <button id="btnOpen" title="P">Open presentation window</button>
        <button id="btnFile" title="Open a different file">File…</button>
        <button id="btnHistory" title="Show time spent per slide">History</button>
      </div>
    </div>
  </div>
</div>

<div id="history">
  <div class="box">
    <div id="historyHead">
      <span>Time per slide</span>
      <button id="historyClose" title="Close">✕</button>
    </div>
    <div id="historyScroll">
      <table>
        <thead><tr><th>#</th><th>Budget</th><th>Last duration</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="err"></div>
<div id="msg">Waiting for first successful build…</div>

<div id="picker">
  <div class="box">
    <div id="pickerHead">
      <div id="pickerPath"></div>
      <button id="pickerClose" title="Close">✕</button>
    </div>
    <div id="pickerErr"></div>
    <div id="pickerList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
